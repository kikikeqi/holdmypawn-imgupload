<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Upload Photo</title></head>
<body style="text-align:center;font-family:sans-serif;padding-top:40px;">
  <h2>Upload a photo of you and your pet, and let the real you both become part of this promise.</h2>
  <p style="margin-top:24px;font-size:18px;">Please select a photo</p>
  <input type="file" id="fileInput" accept="image/*">
  <p id="status"></p>
  <progress id="uploadProgress" value="0" max="100" style="width:80%;margin-top:16px;display:none;"></progress>
  <script>
    const params = new URLSearchParams(window.location.search);
    const session = params.get('session');
    const cloudName = params.get('cloud');
    const preset = params.get('preset');

    // 每次重新选照片，编号往上加一，确保每次上传都是全新的 public_id，不需要 Overwrite 功能
    let attempt = 0;

    document.getElementById('fileInput').addEventListener('change', function (e) {
      attempt++;
      const file = e.target.files[0];
      const progressBar = document.getElementById('uploadProgress');
      const statusEl = document.getElementById('status');

      progressBar.style.display = 'block';
      progressBar.value = 0;
      statusEl.innerText = 'Uploading... 0%';

      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', preset);
      formData.append('public_id', `${session}_${attempt}`);

      // 用 XMLHttpRequest 而不是 fetch，因为只有 XHR 才能拿到「上传中」的即时进度事件
      const xhr = new XMLHttpRequest();
      xhr.open('POST', `https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, true);

      xhr.upload.onprogress = function (event) {
        if (event.lengthComputable) {
          const percent = Math.round((event.loaded / event.total) * 100);
          progressBar.value = percent;
          statusEl.innerText = `Uploading... ${percent}%`;
        }
      };

      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          statusEl.innerText = 'Upload successful! Please return to the device to continue';
        } else {
          statusEl.innerText = 'Upload failed, please try again';
        }
        progressBar.style.display = 'none';
      };

      xhr.onerror = function () {
        statusEl.innerText = 'Upload failed, please try again';
        progressBar.style.display = 'none';
      };

      xhr.send(formData);
    });
  </script>
</body>
</html>
